name: Deploy to Ubuntu Server

on:
  push:
    branches:
     - main    # main branch에서 commit이 있는 경우

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # 코드 체크 아웃
    - name: Checkout repository
      uses: actions/checkout@v2

    # JDK 17 설정
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: '17'

    # gradle 권한 부여
    - name: Setup gradlew permissions
      run: |
        chmod +x ./gradlew

    # gradle build
    - name: Build with Gradle
      run: ./gradlew build

    - name: Set SSH key permission
      run: |
        mkdir -p ~/.ssh
        echo "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCpxekxt40jJIx+sM0x7w/BEGy+4jyN9rk2VQbfE7etf3SNOSvI100q2jpEYdBo23MgQ5AUyTrPjLDNejaJmDZ1fpeMREBKbbsb/YP88g3Zth7WF             4/VLWfJnB3r752PgSm4E2tTWbg5fnhNB0kLtpama2A7fNaGy3ZBFMLjILI03YPS05pRYNNvbAhxV+qfbnC8e/SlA/Dg8STfFCpGxWw6yGu3NctXiWCuGZpmlUQRmoauSEjgvc+endlSUKWSNeabJB             4Y8ysPW6wbS5PeGK37Y3WztCmRap6No5CwAX5scWFK2sAcsh4CJ650DBjvUn4bNXhFOw5ei54RrRvUUaAXBdKwn1ZUgsW8U5TTLy8Y5sextEWQMlCipyj4/l7FBVY21GmUBOD1xX0VK8zj1R1v0hh             WXxU62EYNFNxGxudR2G/oohxumLFMF97gS8wniQJ+2ny77mkQVIlkahkXq9FJGh1PHs12AnmaCjVhfwxbpWHxHEJuuzfxPE0XhUFclKM= ubuntu@ip-172-31-40-36" >> ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/id_rsa
    - name: Add SSH Key
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{secrets.SERVER_SSH_KEY}}

    - name: Add known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H 43.200.178.170 >> ~/.ssh/known_hosts
    - name: Deploy to Server with rsync
      run: |
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.war ubuntu@43.200.178.170:~/app

    - name: Run SSH commands
      run: |
        ssh -i ~/.ssh/id_rsa ubuntu@43.200.178.170 << 'EOF'
            pkill -f 'java -jar'|| true
            nohup java -jar ~/app/SpringBootLastProject-0.0.1-SNAPSHOT.war> log.txt> &1 &EOF
